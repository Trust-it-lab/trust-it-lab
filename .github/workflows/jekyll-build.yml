name: Jekyll build

# Checks that the site still builds. Runs on every push to master and on pull
# requests, so a typo in a page or in _config.yml shows up as a failed check
# instead of a silently broken website.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Ruby 3.1, not newer: this template pins Jekyll 3.9 via the
          # github-pages gem, and its Liquid version calls String#tainted?,
          # which Ruby 3.2 removed.
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
